<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Builder</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">

        <!-- Page Title -->
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <h1 class="h3 mb-0">Resume Builder</h1>
            <p class="text-muted mb-0">Build a tailored resume for your target job position.</p>
          </div>
        </div>

        <form>

          <!-- Target Job Position -->
          <div class="card shadow-sm mb-4">
            <div class="card-body">
              <h2 class="h5 mb-4">Target Job Position</h2>

              <div class="row g-3">
                <div class="col-md-6">
                  <label for="jobTitle" class="form-label">Job Title</label>
                  <input
                    type="text"
                    class="form-control"
                    id="jobTitle"
                    placeholder="e.g. IT Support Specialist"
                  />
                </div>

                <div class="col-md-6">
                  <label for="companyName" class="form-label">Company Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="companyName"
                    placeholder="e.g. XYZ Company"
                  />
                </div>

                <div class="col-12">
                  <label for="jobDescription" class="form-label">Job Description / Responsibilities</label>
                  <textarea
                    class="form-control"
                    id="jobDescription"
                    rows="5"
                    placeholder="Paste the job description here..."
                  ></textarea>
                </div>

                <div class="col-12 text-end">
                  <button type="button" class="btn btn-outline-primary">Save Target Job</button>
                </div>
              </div>
            </div>
          </div>

          <!-- About User -->
          <div class="card shadow-sm mb-4">
            <div class="card-body">
              <h2 class="h5 mb-4">About User</h2>

              <div class="row g-3">
                <div class="col-md-6">
                  <label for="fullName" class="form-label">Full Name</label>
                  <input type="text" class="form-control" id="fullName" />
                </div>

                <div class="col-md-6">
                  <label for="phoneNumber" class="form-label">Phone Number</label>
                  <input type="tel" class="form-control" id="phoneNumber" />
                </div>

                <div class="col-md-6">
                  <label for="emailAddress" class="form-label">Email Address</label>
                  <input type="email" class="form-control" id="emailAddress" />
                </div>

                <div class="col-md-6">
                  <label for="city" class="form-label">City</label>
                  <input type="text" class="form-control" id="city" />
                </div>

                <div class="col-md-6">
                  <label for="state" class="form-label">State</label>
                  <input type="text" class="form-control" id="state" />
                </div>

                <div class="col-md-6">
                  <label for="linkedinUrl" class="form-label">LinkedIn URL</label>
                  <input type="url" class="form-control" id="linkedinUrl" placeholder="https://linkedin.com/in/yourname" />
                </div>

                <div class="col-md-6">
                  <label for="githubUrl" class="form-label">GitHub URL</label>
                  <input type="url" class="form-control" id="githubUrl" placeholder="https://github.com/yourname" />
                </div>

                <div class="col-md-6">
                  <label for="portfolioUrl" class="form-label">Portfolio URL</label>
                  <input type="url" class="form-control" id="portfolioUrl" placeholder="https://yourportfolio.com" />
                </div>
              </div>
            </div>
          </div>

          <!-- Professional Summary -->
          <div class="card shadow-sm mb-4">
            <div class="card-body">
              <h2 class="h5 mb-4">Professional Summary</h2>

              <div class="row g-3">
                <div class="col-12">
                  <label for="professionalSummary" class="form-label">Summary</label>
                  <textarea
                    class="form-control"
                    id="professionalSummary"
                    rows="5"
                    placeholder="Write a short professional summary about yourself..."
                  ></textarea>
                </div>
              </div>
            </div>
          </div>

          <!-- Work Experience -->
          <div class="card shadow-sm mb-4">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h5 mb-0">Work Experience</h2>
                <button type="button" class="btn btn-outline-secondary btn-sm">Add More</button>
              </div>

              <!-- Experience 1 -->
              <div class="border rounded p-3 mb-3">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="jobTitle1" class="form-label">Job Title</label>
                    <input type="text" class="form-control" id="jobTitle1" />
                  </div>

                  <div class="col-md-6">
                    <label for="employer1" class="form-label">Company / Employer</label>
                    <input type="text" class="form-control" id="employer1" />
                  </div>

                  <div class="col-md-6">
                    <label for="workCity1" class="form-label">City</label>
                    <input type="text" class="form-control" id="workCity1" />
                  </div>

                  <div class="col-md-6">
                    <label for="workState1" class="form-label">State</label>
                    <input type="text" class="form-control" id="workState1" />
                  </div>

                  <div class="col-md-6">
                    <label for="startDate1" class="form-label">Start Date</label>
                    <input type="month" class="form-control" id="startDate1" />
                  </div>

                  <div class="col-md-6">
                    <label for="endDate1" class="form-label">End Date</label>
                    <input type="month" class="form-control" id="endDate1" />
                  </div>

                  <div class="col-12">
                    <label for="responsibilities1" class="form-label">Responsibilities / Achievements</label>
                    <textarea
                      class="form-control"
                      id="responsibilities1"
                      rows="4"
                      placeholder="Describe what you did in this role..."
                    ></textarea>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Education -->
          <div class="card shadow-sm mb-4">
            <div class="card-body">
              <h2 class="h5 mb-4">Education</h2>

              <div class="row g-3">
                <div class="col-md-6">
                  <label for="schoolName" class="form-label">School Name</label>
                  <input type="text" class="form-control" id="schoolName" />
                </div>

                <div class="col-md-6">
                  <label for="degree" class="form-label">Degree / Major</label>
                  <input type="text" class="form-control" id="degree" />
                </div>

                <div class="col-md-6">
                  <label for="eduCity" class="form-label">City</label>
                  <input type="text" class="form-control" id="eduCity" />
                </div>

                <div class="col-md-6">
                  <label for="eduState" class="form-label">State</label>
                  <input type="text" class="form-control" id="eduState" />
                </div>

                <div class="col-md-6">
                  <label for="gradDate" class="form-label">Graduation Date</label>
                  <input type="month" class="form-control" id="gradDate" />
                </div>
              </div>
            </div>
          </div>

          <!-- Skills -->
          <div class="card shadow-sm mb-4">
            <div class="card-body">
              <h2 class="h5 mb-4">Skills</h2>

              <div class="row g-3">
                <div class="col-12">
                  <label for="skills" class="form-label">Skills</label>
                  <textarea
                    class="form-control"
                    id="skills"
                    rows="4"
                    placeholder="Example: HTML, CSS, Bootstrap, JavaScript, SQL, Python"
                  ></textarea>
                  <div class="form-text">You can separate skills with commas.</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Create Resume Button -->
          <div class="d-grid mb-5">
            <button type="submit" class="btn btn-success btn-lg btn-lg">Create Resume</button>
          </div>

        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
